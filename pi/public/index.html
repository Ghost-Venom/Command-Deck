<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#0a0e14">
    <title>Command Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">▣</span>
            <span class="brand-text" id="brand-title">COMMAND DECK</span>
        </div>

        <div class="header-center">
            <div class="hero-pill weather" id="weather" hidden>
                <span class="hero-icon" id="weather-icon">·</span>
                <span class="hero-text" id="weather-text">--°</span>
            </div>
            <div class="hero-pill meeting" id="meeting">
                <span class="hero-icon">▷</span>
                <span class="hero-text">loading…</span>
            </div>
            <button class="instance-picker" id="instance-picker" hidden>
                <span class="picker-label">INSTANCE</span>
                <span class="picker-value" id="active-instance-label">—</span>
                <span class="picker-chevron">▾</span>
            </button>
        </div>

        <div class="status">
            <span class="status-dot" id="conn-dot"></span>
            <span class="status-text" id="conn-text">connecting…</span>
            <span class="clock" id="clock">--:--</span>
        </div>
    </header>

    <main class="grid" id="grid"></main>

    <footer class="bottombar">
        <span id="last-update">no data</span>
        <span class="separator">·</span>
        <span id="tile-count">0 tiles</span>
    </footer>

    <!-- Modal overlay (group tiles, instance picker) -->
    <div class="modal-backdrop" id="modal-backdrop" hidden>
        <div class="modal" id="modal">
            <header class="modal-head">
                <div class="modal-title" id="modal-title">—</div>
                <button class="modal-close" id="modal-close" aria-label="Close">×</button>
            </header>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Meeting alert overlay -->
    <div class="meeting-alert" id="meeting-alert">
        <div class="meeting-mark">▷</div>
        <div class="meeting-countdown" id="meeting-countdown">--</div>
        <div class="meeting-subject" id="meeting-subject">—</div>
        <div class="meeting-time" id="meeting-time">—</div>
        <div class="meeting-hint">tap to dismiss</div>
    </div>

    <!-- Offline overlay -->
    <div class="offline-overlay" id="offline-overlay">
        <div class="offline-mark">⏻</div>
        <div class="offline-title">Agent Offline</div>
        <div class="offline-sub" id="offline-detail">Waiting for agent…</div>
        <div class="offline-hint">tap to dismiss</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
